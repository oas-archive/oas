<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAS 典藏館</title>
<link rel="icon" href="oas-icon.png">
<style>
  :root { color-scheme: dark; --ambient: #8c82ff }
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080b12; color: #ecf0ff; font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif; overflow: hidden }
  body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 70% 10%, #8c82ff30, transparent 40%), radial-gradient(circle at 30% 90%, #d17c9f1c, transparent 45%); pointer-events: none }
  main { position: relative; text-align: center; padding: 16px }
  img { width: 112px; height: 112px; filter: drop-shadow(0 18px 40px #8c82ff55); animation: float 3.2s ease-in-out infinite }
  h1 { margin: 26px 0 8px; font-size: 22px; font-weight: 500; letter-spacing: .04em }
  p { margin: 0; color: #9fa9c4; font-size: 13px; line-height: 1.7 }
  .bar { width: 220px; height: 3px; margin: 26px auto 0; overflow: hidden; border-radius: 99px; background: #ffffff12 }
  .bar span { display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #8c82ff, #d17c9f); animation: slide 1.4s ease-in-out infinite }
  .slow { margin-top: 18px; opacity: 0; transition: opacity .6s; font-size: 12px }
  .slow.show { opacity: 1 }
  @keyframes float { 50% { transform: translateY(-8px) } }
  @keyframes slide { from { transform: translateX(-110%) } to { transform: translateX(260%) } }
  @media (prefers-reduced-motion: reduce) { img, .bar span { animation: none } }
</style>
</head>
<body>
<main>
  <img src="oas-icon.png" alt="">
  <h1>正在喚醒典藏館…</h1>
  <p id="status">啟動本機服務中，完成後會自動進入。</p>
  <div class="bar"><span></span></div>
  <p class="slow" id="slow">第一次開啟要準備執行環境、打包網頁，可能需要一兩分鐘，請稍候。</p>
</main>
<script>
  // 服務尚未就緒時請求會失敗；就緒後（即使是不透明回應）即跳轉。
  const target = 'http://localhost:8080/'
  const started = Date.now()
  const poll = async () => {
    try {
      await fetch(target, { mode: 'no-cors', cache: 'no-store' })
      location.replace(target)
      return
    } catch { /* 尚未就緒 */ }
    const seconds = (Date.now() - started) / 1000
    if (seconds > 20) document.getElementById('slow').classList.add('show')
    if (seconds > 300) {
      document.querySelector('h1').textContent = '啟動時間比預期久'
      document.getElementById('status').textContent = '若跳出錯誤視窗，請依提示處理；也可以關閉此頁後重新點擊捷徑。'
    }
    setTimeout(poll, 1000)
  }
  poll()
</script>
</body>
</html>
