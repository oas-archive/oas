services:
  api:
    build: ./backend
    environment:
      OAS_DATA_DIR: /data             # 資料庫與封面（Docker 磁碟區）
      OAS_DATABASE_URL: sqlite:////data/oas.db
      OAS_BACKUP_DIR: /backups
      OAS_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - oas-data:/data
      - ../backups:/backups:ro   # 側欄顯示最後備份時間（唯讀，API 不會寫入或刪除備份）
    # 只綁本機（127.0.0.1）：同一個網路的其他電腦連不進來。API 本身沒有登入機制。
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  oas-data:

