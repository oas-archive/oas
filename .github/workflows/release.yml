name: 發布免安裝版

# 推送 v 開頭的標籤（例如 v0.15.8）時，打包 Windows 免安裝版並建立 Release。
# Release 由 github-actions 機器人建立。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"  # Windows 主機預設的輸出編碼不支援中文

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: 執行測試
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: 打包免安裝版
        run: python tools/build_portable.py
      - name: 建立 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "OAS $GITHUB_REF_NAME" \
            --notes "Windows 免安裝版：下載 zip，解壓縮後雙擊「開啟 OAS.cmd」。不需要安裝 Python 或 Node.js。"
